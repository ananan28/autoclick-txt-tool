name: Anan gender v5 EXE
on:
  push:
    branches: [anan-gender-v5-exe]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Check dictionary and classification
        run: |
          python -c "import app; assert len(app.NAME_DB)>45000; assert app.predict_gender('John Smith')=='男'; assert app.predict_gender('Mary Smith')=='女'; print('Dictionary and full-name classification verified')"
      - name: Build single-file EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AnanGender-v5.0 --hidden-import openpyxl --hidden-import xlrd --hidden-import pyxlsb --hidden-import odf --hidden-import docx --hidden-import pypdf --hidden-import lxml.etree --hidden-import psutil --add-data "LICENSE-dictionary.txt;." --add-data "GNU_DOC.txt;." app.py
      - name: Verify standalone launch
        run: |
          $app = Start-Process -FilePath (Resolve-Path 'dist/AnanGender-v5.0.exe') -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          $windows = @(Get-Process | Where-Object { $_.ProcessName -eq 'AnanGender-v5.0' -and $_.MainWindowHandle -ne 0 })
          if ($app.HasExited -or $windows.Count -eq 0) { throw 'Standalone app did not open a window' }
          Write-Host "Verified window: $($windows[0].MainWindowTitle)"
          Get-Process -Name 'AnanGender-v5.0' | Stop-Process
      - uses: actions/upload-artifact@v4
        with:
          name: AnanGender-v5-Windows-EXE
          path: anan/dist/AnanGender-v5.0.exe
          if-no-files-found: error
