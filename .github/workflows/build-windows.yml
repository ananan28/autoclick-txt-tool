name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check source syntax
        run: python -m compileall -q app.pyw automation_core.py windows_input.py
      - name: Package application
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AutoClickTXT app.pyw
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler not found' }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify installation and launch
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'AutoClickTXT-installed'
          $setup = Start-Process -FilePath (Resolve-Path 'installer-output/AutoClickTXT-3.0.0-Setup.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installation failed: $($setup.ExitCode)" }
          if (!(Test-Path "$target/unins000.exe")) { throw 'Uninstaller missing' }
          $app = Start-Process -FilePath "$target/AutoClickTXT.exe" -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw 'Application exited during startup' }
          if ($app.MainWindowHandle -eq 0) { throw 'Application window did not appear' }
          Write-Host "Verified application window: $($app.MainWindowTitle)"
          Stop-Process -Id $app.Id
          $uninstall = Start-Process -FilePath "$target/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path "$target/AutoClickTXT.exe") { throw 'Application still present after uninstall' }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClickTXT-Windows-Installer
          path: installer-output/AutoClickTXT-3.0.0-Setup.exe
          if-no-files-found: error
